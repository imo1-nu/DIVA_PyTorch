[project]
name = "diva-experiments"
version = "0.1.0"
description = "Reproduction experiments for Civier et al. (2010) using DIVA_PyTorch"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "sounddevice>=0.4",
    "librosa>=0.10",
    "soundfile>=0.12",
    "praat-parselmouth>=0.4.7",
]

[dependency-groups]
dev = [
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[tool.uv]
link-mode = "copy"

